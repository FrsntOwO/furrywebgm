<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦊 FurryWebGM</title>

<style>
:root{
    --bg:#181421;
    --panel:#241d33;
    --pink:#ff8fd8;
    --cyan:#8fe7ff;
    --purple:#c8a2ff;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#181421,#241d33,#1c273d);
    color:var(--text);
    min-height:100vh;
}

header{
    background:rgba(36,29,51,.95);
    text-align:center;
    padding:25px;
    border-bottom:3px solid var(--pink);
}

h1{color:var(--pink);font-size:3rem;}
.subtitle{color:var(--cyan);}

main{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.hero{
    background:var(--panel);
    padding:20px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
}

.category-title{
    margin-top:30px;
    color:var(--cyan);
    border-left:5px solid var(--pink);
    padding-left:10px;
}

.game-card{
    background:rgba(45,36,64,.95);
    padding:20px;
    margin-top:15px;
    border-radius:15px;
}

.start-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,var(--pink),var(--purple));
}

.game-frame{
    width:100%;
    height:500px;
    border:none;
    margin-top:10px;
    border-radius:10px;
    display:none;
}

/* BOTÓN LOGROS */
.ach-btn{
    display:inline-block;
    margin-top:10px;
    padding:10px 15px;
    border-radius:10px;
    background:#ff8fd8;
    color:black;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<header>
    <h1>🦊 FurryWebGM</h1>
    <p class="subtitle">🎮 Portal de juegos</p>
</header>

<main>

<section class="hero">
    <h2>🎮 Juegos</h2>
    <p>Explora y desbloquea logros 🏆</p>

    <!-- LINK A LOGROS -->
    <a class="ach-btn" href="logros.html">🏆 Ver Logros</a>
</section>

<h2 class="category-title">⛏️ Sandbox</h2>

<div class="game-card">
    <h3>Eaglercraft</h3>
    <button class="start-btn" onclick="startGame(this,'https://eaglercraft.com/play')">▶ Iniciar</button>
    <iframe class="game-frame"></iframe>
</div>

<h2 class="category-title">🏎️ Carreras</h2>

<div class="game-card">
    <h3>PolyTrack</h3>
    <button class="start-btn" onclick="startGame(this,'https://app-polytrack.kodub.com/0.5.0/?')">▶ Iniciar</button>
    <iframe class="game-frame"></iframe>
</div>

<div class="game-card">
    <h3>HexGL</h3>
    <button class="start-btn" onclick="startGame(this,'https://hexgl.bkcore.com/play/')">▶ Iniciar</button>
    <iframe class="game-frame"></iframe>
</div>

<h2 class="category-title">🟢 .IO</h2>

<div class="game-card">
    <h3>Agar.io</h3>
    <button class="start-btn" onclick="startGame(this,'https://agar.io')">▶ Iniciar</button>
    <iframe class="game-frame"></iframe>
</div>

</main>

<script>
function startGame(btn,url){
    const frame = btn.parentElement.querySelector(".game-frame");

    if(frame.style.display==="block"){
        frame.style.display="none";
        frame.src="";
        btn.textContent="▶ Iniciar";
    }else{
        frame.style.display="block";
        frame.src=url;
        btn.textContent="⏸ Ocultar";

        unlock("s1");
    }

    unlock("s2");
}

/* guardado */
let unlocked = JSON.parse(localStorage.getItem("furryAch")||"[]");

function unlock(id){
    if(unlocked.includes(id)) return;

    unlocked.push(id);
    localStorage.setItem("furryAch",JSON.stringify(unlocked));
}
</script>

</body>
</html>
