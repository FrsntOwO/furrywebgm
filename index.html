<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🦊 FurryWebGM</title>

<style>
:root{
--bg:#181421;
--panel:#241d33;
--card:#2d2440;
--pink:#ff8fd8;
--cyan:#8fe7ff;
--purple:#c8a2ff;
--text:#fff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:linear-gradient(135deg,#181421,#241d33,#1c273d);
color:var(--text);
min-height:100vh;
}

header{
background:rgba(36,29,51,.95);
border-bottom:3px solid var(--pink);
text-align:center;
padding:25px;
}

h1{font-size:3rem;color:var(--pink);}
.subtitle{color:var(--cyan);}

main{
max-width:1200px;
margin:auto;
padding:20px;
}

.category-title{
margin-top:40px;
color:var(--cyan);
border-left:5px solid var(--pink);
padding-left:15px;
}

.game-grid{
display:flex;
flex-direction:column;
gap:20px;
}

.game-card{
background:#2d2440;
border-radius:20px;
padding:20px;
border:1px solid rgba(255,143,216,.3);
}

.game-title{
color:var(--cyan);
font-size:1.2rem;
}

.start-btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,var(--pink),var(--purple));
cursor:pointer;
color:white;
margin-top:10px;
}

.game-frame{
width:100%;
height:520px;
margin-top:15px;
border:none;
border-radius:15px;
display:none;
background:black;
}

input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
margin-top:10px;
}

footer{
margin-top:40px;
background:var(--panel);
text-align:center;
padding:20px;
}

/* iPad */
@media (max-width:768px){
.game-frame{height:320px;}
}
</style>
</head>

<body>

<header>
<h1>🦊 FurryWebGM</h1>
<p class="subtitle">🎮 Portal completo de juegos + logros</p>
</header>

<main>

<!-- RETRO -->
<h2 class="category-title">🎮 Retro OnlineMania</h2>

<div class="game-grid">

<div class="game-card">
<div class="game-title">Super Mario Bros</div>
<button class="start-btn" onclick="startGame(this,'https://www.onlinemania.es/file.php?f=1288&iframe=1')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Super Mario 64</div>
<button class="start-btn" onclick="startGame(this,'https://www.onlinemania.es/file.php?f=4269&iframe=1')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Pokémon Fuego Rojo</div>
<button class="start-btn" onclick="startGame(this,'https://www.onlinemania.es/file.php?f=8265&iframe=1')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Pokémon Verde Hoja</div>
<button class="start-btn" onclick="startGame(this,'https://www.onlinemania.es/file.php?f=8268&iframe=1')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

</div>

<!-- TUS JUEGOS -->
<h2 class="category-title">🕹️ Tus juegos</h2>

<div class="game-grid">

<div class="game-card">
<div class="game-title">Eaglercraft</div>
<button class="start-btn" onclick="startGame(this,'https://eaglercraft.com/play')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">PolyTrack</div>
<button class="start-btn" onclick="startGame(this,'https://app-polytrack.kodub.com/0.5.0/?')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">HexGL</div>
<button class="start-btn" onclick="startGame(this,'https://hexgl.bkcore.com/play/')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Plants vs Zombies</div>
<button class="start-btn" onclick="startGame(this,'https://pvzonline.com')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Agar.io</div>
<button class="start-btn" onclick="startGame(this,'https://agar.io')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">Cookie Clicker</div>
<button class="start-btn" onclick="startGame(this,'https://orteil.dashnet.org/cookieclicker/')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

<div class="game-card">
<div class="game-title">2048</div>
<button class="start-btn" onclick="startGame(this,'https://play2048.co/')">▶ Jugar</button>
<iframe class="game-frame"></iframe>
</div>

</div>

<!-- CÓDIGOS -->
<h2 class="category-title">🔐 Códigos secretos</h2>

<div class="game-card">

<input id="codeInput" placeholder="Escribe código secreto">

<button class="start-btn" onclick="redeemCode()">🔑 Canjear</button>

<p id="progressText"></p>

<div id="achievementsBox"></div>

</div>

</main>

<footer>
© 2026 FurryWebGM
</footer>

<script>

/* 🎮 JUEGOS */
function startGame(btn,url){
const frame=btn.parentElement.querySelector("iframe");
frame.style.display="block";
frame.src=url;
}

/* 🏆 CÓDIGOS + LOGROS */
const codes = {

/* FURRY */
"uwu":"🦊 Fursuit Nivel 1",
"owo":"🐾 Convención Secreta",
"beans":"🐾 Almohadillas Legendarias",
"tail":"🦊 Cola Esponjosa",
"howl":"🐺 Aullido Nocturno",
"yeen":"🐺 Caos Hiena",
"foxo":"🦊 Espíritu del Zorro",
"protogen":"🤖 Visitante Cibernético",
"dragon":"🐉 Escamas Antiguas",

/* GLITCH */
"gameoverse":"📺 Error del Multiverso",
"glitch":"🌀 Entre Canales",
"signal":"⚠️ Señal Corrupta",
"static":"📼 Ruido Eterno",
"vhs":"📼 Archivo Analógico",
"404tv":"📺 Canal Perdido",
"corrupt":"💾 Datos Dañados",

/* MEMES */
"meme":"🗿 Furro Legendario",
"internet":"😂 Demasiado Internet",
"cheems":"📸 Coleccionista de Memes",
"doge":"🐕 Sabiduría Antigua",
"sus":"🚨 Sospechoso",
"brainrot":"🧠 Daño de Internet",

/* EXPERIMENTO */
"changed":"🧪 Sujeto de Pruebas",
"latex":"⚫ Contacto Inesperado",
"lab":"🔬 Laboratorio Oculto",
"sample":"🧫 Muestra Desconocida",
"containment":"🚪 Zona Sellada",
"blackgoo":"⚫ Materia Extraña",

/* SECRETOS */
"secret":"👁️ No Debías Ver Esto",
"archive":"💾 Archivo Oculto",
"admin":"🔒 Acceso Administrativo",
"developer":"🛠 Modo Desarrollador",
"easteregg":"🥚 Cazador de Secretos",
"furrywebgm":"👑 Guardián del Portal",
"all":"🌌 Maestro de los Secretos",

/* BONUS */
"konami":"🎮 Código Legendario",
"void":"🌌 Vacío Total",
"exit":"🚪 Salida Oculta",
"uwuowo":"🦊🐾 Forma Final"
};

let unlocked = JSON.parse(localStorage.getItem("fwgm") || "[]");

function redeemCode(){

let code=document.getElementById("codeInput").value.toLowerCase().trim();

if(codes[code]){

if(!unlocked.includes(code)){
unlocked.push(code);
localStorage.setItem("fwgm",JSON.stringify(unlocked));
}

alert("🏆 "+codes[code]);

render();

}else{
alert("❌ Código inválido");
}

document.getElementById("codeInput").value="";
}

function render(){

let box=document.getElementById("achievementsBox");

box.innerHTML="";

unlocked.forEach(c=>{

let div=document.createElement("div");
div.className="game-card";
div.style.marginTop="10px";
div.textContent=c+" → "+codes[c];

box.appendChild(div);

});

document.getElementById("progressText").textContent=
"🏆 Logros: "+unlocked.length;

}

render();

</script>

</body>
</html>
