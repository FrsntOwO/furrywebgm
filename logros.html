<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏆 Logros</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:linear-gradient(135deg,#181421,#241d33,#1c273d);
    color:white;
}

header{
    text-align:center;
    padding:25px;
    background:rgba(36,29,51,.95);
    border-bottom:3px solid #ff8fd8;
}

h1{color:#ff8fd8;}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.box{
    background:rgba(45,36,64,.95);
    padding:15px;
    border-radius:15px;
}

.ach{
    background:rgba(255,255,255,0.08);
    margin:6px 0;
    padding:10px;
    border-radius:8px;
}

a{
    display:block;
    margin:20px auto;
    text-align:center;
    background:#ff8fd8;
    color:black;
    padding:12px;
    border-radius:10px;
    text-decoration:none;
    width:200px;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h1>🏆 Logros desbloqueados</h1>
</header>

<div class="container">

<div class="box" id="box">
    Cargando...
</div>

<a href="index.html">⬅ Volver</a>

</div>

<script>
const achievements = {
    s1:"🎮 Primer Juego iniciado",
    s2:"🖱️ Interacción con la web"
};

let unlocked = JSON.parse(localStorage.getItem("furryAch")||"[]");

const box = document.getElementById("box");

if(unlocked.length===0){
    box.innerHTML="Sin logros aún 🐾";
}else{
    box.innerHTML="";
    unlocked.forEach(id=>{
        const div=document.createElement("div");
        div.className="ach";
        div.textContent=achievements[id]||"Logro desconocido";
        box.appendChild(div);
    });
}
</script>

</body>
</html>
